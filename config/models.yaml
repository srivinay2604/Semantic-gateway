# Model alias -> provider/model mapping
# Each alias has a primary provider and an optional fallback chain.
# Provider format: "<provider_name>/<model_id>"
#
# Available provider names (Phase 1):
#   mock  — MockProvider (deterministic, configurable latency)
#
# Additional provider names added in Phase 2:
#   openai, anthropic, ollama

models:
  # Fast mock endpoint — always resolves to the mock provider
  mock-fast:
    primary: mock/echo
    fallbacks: []

  # OpenAI GPT-4o-mini
  gpt-4o-mini:
    primary: openai/gpt-4o-mini
    fallbacks: [mock/echo]

  # Anthropic Claude 3 Haiku
  claude-haiku:
    primary: anthropic/claude-3-haiku-20240307
    fallbacks: [mock/echo]
