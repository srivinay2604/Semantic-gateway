[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachegate"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with exact + semantic caching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CacheGate Contributors" }]
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "redis==8.1.0",
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "tiktoken==0.14.0",
  "PyYAML==6.0.3",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "pytest-cov==7.1.0",
  "openai==3.31.0",
  "types-PyYAML==6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cachegate"]

# ---------------------------------------------------------------------------
# Ruff configuration
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ANN", # flake8-annotations
]
ignore = [
  "ANN401",  # dynamically typed expressions (Any)
  "B008",    # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["cachegate"]

# ---------------------------------------------------------------------------
# Mypy configuration
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "benchmarks/"]

[[tool.mypy.overrides]]
module = "cachegate.*"
disallow_untyped_defs = true
disallow_any_generics = true

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/cachegate --cov-report=term-missing --cov-report=html --cov-fail-under=85"

[tool.coverage.run]
source = ["src/cachegate"]
omit = ["*/placeholder*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING",
]
